stages:
  - build
  - deploy

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "d-deploy" || $CI_COMMIT_BRANCH == "stg-deploy" || $CI_COMMIT_BRANCH == "prod-deploy"'
      when: always
    - when: never

# Các biến bạn cần set trong GitLab CI/CD Settings (hoặc ở nhóm/project):
#AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (hoặc dùng cách khác như OIDC)
#AWS_DEFAULT_REGION: "ap-northeast-1"
#ECR_REGISTRY: "<account>.dkr.ecr.<region>.amazonaws.com"
#ECR_REPOSITORY_GATEWAY / _WRITE / _READ / _OAUTH: "repository-name" (không kèm registry)
#ECS_CLUSTER
#ECS_TASK_DEF_GATEWAY / _WRITE / _READ / _OAUTH: family hoặc task-definition ARN
#ECS_SERVICE_GATEWAY / _WRITE / _READ / _OAUTH: tên ECS service
#ECS_CONTAINER_NAME_GATEWAY / _WRITE / _READ / _OAUTH: name container trong task-definition

.build_template:
  stage: build
  image: docker:27.0.3
  services:
    - name: docker:27.0.3-dind
      command: ["--tls=false"]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_DRIVER: overlay2
    DOCKER_BUILDKIT: "1"
    DOCKER_HOST: "tcp://docker:2375"
  before_script:
    - apk add --no-cache python3 py3-pip jq bash
    - pip3 install --no-cache-dir --user awscli
    - export PATH="$PATH:/root/.local/bin:/home/gitlab/.local/bin:$HOME/.local/bin"
    - aws --version
    - |
      # OIDC assume-role (không cần AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY tĩnh)
      if [ "$CI_COMMIT_BRANCH" = "d-deploy" ]; then
        AWS_ROLE_ARN="${AWS_ROLE_ARN_DEV}"
      elif [ "$CI_COMMIT_BRANCH" = "stg-deploy" ]; then
        AWS_ROLE_ARN="${AWS_ROLE_ARN_STG:-$AWS_ROLE_ARN_DEV}"
      elif [ "$CI_COMMIT_BRANCH" = "prod-deploy" ]; then
        AWS_ROLE_ARN="${AWS_ROLE_ARN_PROD:-$AWS_ROLE_ARN_DEV}"
      else
        AWS_ROLE_ARN="${AWS_ROLE_ARN_DEV}"
      fi

      if [ -z "${AWS_ROLE_ARN:-}" ] || [ -z "${GITLAB_OIDC_TOKEN:-}" ]; then
        echo "Missing AWS_ROLE_ARN_DEV/STG/PROD or GITLAB_OIDC_TOKEN. Set AWS role ARN and enable job id_tokens." >&2
        exit 1
      fi

      aws_sts_output="$(aws sts assume-role-with-web-identity \
        --role-arn "$AWS_ROLE_ARN" \
        --role-session-name "GitLabRunner-${CI_PROJECT_ID}-${CI_PIPELINE_ID}" \
        --web-identity-token "$GITLAB_OIDC_TOKEN" \
        --duration-seconds 3600 \
        --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
        --output text)"

      export $(printf "AWS_ACCESS_KEY_ID=%s AWS_SECRET_ACCESS_KEY=%s AWS_SESSION_TOKEN=%s" $aws_sts_output)

      aws sts get-caller-identity
      aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

.deploy_template:
  stage: deploy
  image: alpine:3.20
  before_script:
    - apk add --no-cache python3 py3-pip jq bash
    - pip3 install --no-cache-dir --user awscli
    - export PATH="$PATH:/root/.local/bin:/home/gitlab/.local/bin:$HOME/.local/bin"
    - aws --version
    - |
      # OIDC assume-role (không cần AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY tĩnh)
      if [ "$CI_COMMIT_BRANCH" = "d-deploy" ]; then
        AWS_ROLE_ARN="${AWS_ROLE_ARN_DEV}"
      elif [ "$CI_COMMIT_BRANCH" = "stg-deploy" ]; then
        AWS_ROLE_ARN="${AWS_ROLE_ARN_STG:-$AWS_ROLE_ARN_DEV}"
      elif [ "$CI_COMMIT_BRANCH" = "prod-deploy" ]; then
        AWS_ROLE_ARN="${AWS_ROLE_ARN_PROD:-$AWS_ROLE_ARN_DEV}"
      else
        AWS_ROLE_ARN="${AWS_ROLE_ARN_DEV}"
      fi

      if [ -z "${AWS_ROLE_ARN:-}" ] || [ -z "${GITLAB_OIDC_TOKEN:-}" ]; then
        echo "Missing AWS_ROLE_ARN_DEV/STG/PROD or GITLAB_OIDC_TOKEN. Set AWS role ARN and enable job id_tokens." >&2
        exit 1
      fi

      aws_sts_output="$(aws sts assume-role-with-web-identity \
        --role-arn "$AWS_ROLE_ARN" \
        --role-session-name "GitLabRunner-${CI_PROJECT_ID}-${CI_PIPELINE_ID}" \
        --web-identity-token "$GITLAB_OIDC_TOKEN" \
        --duration-seconds 3600 \
        --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
        --output text)"

      export $(printf "AWS_ACCESS_KEY_ID=%s AWS_SECRET_ACCESS_KEY=%s AWS_SESSION_TOKEN=%s" $aws_sts_output)

      aws sts get-caller-identity

build_images:
  extends: .build_template
  tags:
    - k8s
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: $GITLAB_OIDC_AUD
  parallel:
    matrix:
      - MODULE: ProjectGateway
        SERVICE_KEY: gateway
        PORT: "8080"
      - MODULE: ProjectWrite
        SERVICE_KEY: write
        PORT: "9091"
      - MODULE: ProjectRead
        SERVICE_KEY: read
        PORT: "9092"
      - MODULE: ProjectOauth
        SERVICE_KEY: oauth
        PORT: "9191"
  script:
    - set -euo
    - |
      case "$SERVICE_KEY" in
        gateway) ECR_REPO_NAME="$ECR_REPOSITORY_GATEWAY" ;;
        write) ECR_REPO_NAME="$ECR_REPOSITORY_WRITE" ;;
        read) ECR_REPO_NAME="$ECR_REPOSITORY_READ" ;;
        oauth) ECR_REPO_NAME="$ECR_REPOSITORY_OAUTH" ;;
        *) echo "Unknown SERVICE_KEY=$SERVICE_KEY" >&2; exit 1 ;;
      esac
    - IMAGE_URI="$ECR_REGISTRY/$ECR_REPO_NAME:$CI_COMMIT_SHORT_SHA"
    - echo "Building $MODULE -> $IMAGE_URI"

    - aws ecr describe-repositories --repository-names "$ECR_REPO_NAME" >/dev/null 2>&1 || aws ecr create-repository --repository-name "$ECR_REPO_NAME"
    - docker build --build-arg MODULE="$MODULE" --build-arg PORT="$PORT" -t "$IMAGE_URI" .
    - docker push "$IMAGE_URI"

deploy_images:
  extends: .deploy_template
  tags:
    - k8s
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: $GITLAB_OIDC_AUD
  parallel:
    matrix:
      - MODULE: ProjectGateway
        SERVICE_KEY: gateway
      - MODULE: ProjectWrite
        SERVICE_KEY: write
      - MODULE: ProjectRead
        SERVICE_KEY: read
      - MODULE: ProjectOauth
        SERVICE_KEY: oauth
  script:
    - set -euo
    - |
      case "$SERVICE_KEY" in
        gateway)
          ECR_REPO_NAME="$ECR_REPOSITORY_GATEWAY"
          ECS_TASK_DEF="$ECS_TASK_DEF_GATEWAY"
          ECS_SERVICE="$ECS_SERVICE_GATEWAY"
          ECS_CONTAINER_NAME="$ECS_CONTAINER_NAME_GATEWAY"
          ;;
        write)
          ECR_REPO_NAME="$ECR_REPOSITORY_WRITE"
          ECS_TASK_DEF="$ECS_TASK_DEF_WRITE"
          ECS_SERVICE="$ECS_SERVICE_WRITE"
          ECS_CONTAINER_NAME="$ECS_CONTAINER_NAME_WRITE"
          ;;
        read)
          ECR_REPO_NAME="$ECR_REPOSITORY_READ"
          ECS_TASK_DEF="$ECS_TASK_DEF_READ"
          ECS_SERVICE="$ECS_SERVICE_READ"
          ECS_CONTAINER_NAME="$ECS_CONTAINER_NAME_READ"
          ;;
        oauth)
          ECR_REPO_NAME="$ECR_REPOSITORY_OAUTH"
          ECS_TASK_DEF="$ECS_TASK_DEF_OAUTH"
          ECS_SERVICE="$ECS_SERVICE_OAUTH"
          ECS_CONTAINER_NAME="$ECS_CONTAINER_NAME_OAUTH"
          ;;
        *) echo "Unknown SERVICE_KEY=$SERVICE_KEY" >&2; exit 1 ;;
      esac
    - IMAGE_URI="$ECR_REGISTRY/$ECR_REPO_NAME:$CI_COMMIT_SHORT_SHA"

    - echo "Deploying ECS service $ECS_SERVICE with image $IMAGE_URI"

    - |
      # Lấy task definition hiện tại
      TD_JSON="$(aws ecs describe-task-definition --task-definition "$ECS_TASK_DEF" --output json)"
      TD_BASE="$(echo "$TD_JSON" | jq '.taskDefinition')"

      # Nếu không truyền container name thì lấy container đầu tiên trong task definition
      if [ -z "${ECS_CONTAINER_NAME}" ] || [ "${ECS_CONTAINER_NAME}" = "null" ]; then
        ECS_CONTAINER_NAME="$(echo "$TD_BASE" | jq -r '.containerDefinitions[0].name')"
      fi
      echo "Using ECS container: $ECS_CONTAINER_NAME"

      # Xóa các field không được phép khi register task definition mới
      TD_CLEAN="$(echo "$TD_BASE" | jq 'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)')"

      # Update image cho đúng container
      TD_UPDATED="$(echo "$TD_CLEAN" | jq --arg CONTAINER "$ECS_CONTAINER_NAME" --arg IMAGE "$IMAGE_URI" '
        .containerDefinitions |= map(if .name == $CONTAINER then .image = $IMAGE else . end)
      ')"

      NEW_TD_ARN="$(aws ecs register-task-definition --cli-input-json "$TD_UPDATED" --query 'taskDefinition.taskDefinitionArn' --output text)"
      aws ecs update-service \
        --cluster "$ECS_CLUSTER" \
        --service "$ECS_SERVICE" \
        --task-definition "$NEW_TD_ARN" \
        --force-new-deployment

      # Chờ ổn định (có thể mất vài phút tùy vào load/health checks)
      aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"

