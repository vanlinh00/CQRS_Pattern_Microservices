version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql_2port1image
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: 2Port1Image
      MYSQL_USER: user001
      MYSQL_PASSWORD: user001
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  mysql_data: