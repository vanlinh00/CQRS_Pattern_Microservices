server:
  port: 9090

security:
    origin:
      domain: ${ORIGIN_DOMAIN:}
      allow: ${ORIGIN_ALLOW:true}
    oauth2:
      client:
        client-id: mobile-client
        client-secret: mobile-client
        access-token-uri: ${AUTH_SERVER_URL:http://localhost:8081}/oauth/token
        user-authorization-uri: ${AUTH_SERVER_URL:http://localhost:8081}/oauth/authorize
        scope: read,write,trust
        grant-type: client_credentials
      resource:
        id: resource_id
        # URI of the user endpoint.
        userInfoUri: ${SERVER_URL:http://localhost:8081}/api/v1/customer/me
        # URI of the token decoding endpoint.
        tokenInfoUri: ${AUTH_SERVER_URL:http://localhost:9191}/oauth/check_token

spring:
  datasource:
    #url: jdbc:mysql://mysql_2port1image:3306/2Port1Image?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    url: jdbc:mysql://localhost:3307/2Port1Image?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    username: user001
    password: user001
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

logging:
  level:
    liquibase: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
    org.springframework.web: DEBUG
    org.springframework.jdbc.core: DEBUG
    org.springframework.jdbc.core.JdbcTemplate: DEBUG
    org.springframework.jdbc.core.StatementCreatorUtils: TRACE

