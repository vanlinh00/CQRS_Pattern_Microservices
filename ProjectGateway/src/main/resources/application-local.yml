server:
  port: 8080

# CQRS routing: Write (POST/PUT/DELETE) -> Write service, Read (GET) -> Read service
spring:
  cloud:
    gateway:
      routes:
        # OAuth - token, logout
        - id: oauth-service
          uri: ${OAUTH_SERVICE_URI:http://localhost:9191}
          predicates:
            - Path=/oauth/**
        # Write service - commands (insert, update, delete, upload)
        - id: write-service
          uri: ${WRITE_SERVICE_URI:http://localhost:9091}
          predicates:
            - Path=/api/**
            - Method=POST,PUT,DELETE,PATCH
        # Read service - queries (cache-first, fallback to read replica)
        - id: read-service
          uri: ${READ_SERVICE_URI:http://localhost:9092}
          predicates:
            - Path=/api/**
            - Method=GET
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
