server:
  port: 9092

security:
  origin:
    domain: ${ORIGIN_DOMAIN:}
    allow: ${ORIGIN_ALLOW:true}
  oauth2:
    client:
      client-id: mobile-client
      client-secret: mobile-client
    resource:
      tokenInfoUri: ${AUTH_SERVER_URL:http://localhost:9191}/oauth/check_token

# RDS read replica (use same DB as primary for local dev)
spring:
  datasource:
    url: ${READ_REPLICA_URL:jdbc:mysql://localhost:3307/2Port1Image?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
    username: user001
    password: user001
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
